about_course:
  - content: |
      所有老师统一使用PPT。中英文夹杂，图示略有不清，两本教材都参考到。一章一发，每章的第一节课往往用不到。
      听课可能有一定必要，一些问题可能只在课堂上讲，作业/考研的内容都不涉及。
    submitter:
      name: ""
      link: ""
about_exam:
  - content: |
      2019级：
      PPT + PPT 例题 + 往年题 + 作业题 + 王道，重要性依次递减。
      老师照例会捞分。
    submitter:
      name: ""
      link: ""
  - content: |
      2020级：
      题量减少，10 填空 + 6 判断 + 12 选择（2分） + 4大题（60分），不太会出现做不完的情况。
      考试内容来源：PPT + 往年题 + 考研题 + MOOC题。最重要的还是PPT，往年题参考价值也很大。
      PPT 细节会考很多，比如路由器体系结构、虚电路、BitTorrent协议等。
      考研题部分，王道的408和工大的往年题都可以参考。
    submitter:
      name: ""
      link: ""
study_advice:
  - content: |
      关于实验 (2018级):
      实验分为三个部分：自己动手写协议栈、抓包实验、套接字编程实验。
      抓包实验比较水。
      协议栈实验从18级开始设置，比较考验人的动手能力，量比较大，也比较花时间，但很有意思，很能增长C语言水平，也增进了对计算机网络协议栈的理解与直观感受。
      套接字编程，是计网课程的直接应用场景，一般选自于《计算机网络：自顶向下方法》，难度比较低。
    submitter:
      name: ""
      link: ""
  - content: |
      关于实验 (2019级):
      实验内容涵盖有编程设计型和配置验证型两种类型，总共 9 个小实验。
      配置验证型实验：VLAN 与接口模式配置、RIP 路由配置及协议分析、NAT 组网实验。
      编程设计型实验：
      1. 协议栈编程实验：实现以太网收发 → ARP 解析 → IP 协议实现 → ping 响应 → UDP 实现。
      2. Socket编程实验: 邮件客户端的设计与实现。
    submitter:
      name: ""
      link: ""
  - content: "这门课可能确实比较折磨。但是计网的知识还是很重要，请自己想办法学好来。"
    submitter:
      name: ""
      link: ""
